name: Deploy PWA to GitHub Pages

# Build della PWA Vue e pubblicazione su GitHub Pages.
# NON esegue migrazioni del database: le migrazioni SQL sono applicate a Supabase
# con un'operazione separata e consapevole (vedi supabase/migrations).
#
# VITE_SUPABASE_URL e VITE_SUPABASE_PUBLISHABLE_KEY sono PUBBLICHE (incorporate
# nel bundle). Configurarle come "Repository variables" (non secrets reali).
# NON inserire qui service_role key o altri veri segreti.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
          VITE_MAP_STYLE_URL: ${{ vars.VITE_MAP_STYLE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
